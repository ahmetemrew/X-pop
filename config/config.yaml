# X-Pop Bot Konfigürasyonu

# Çalışma Modu
# "api" - Twitter API kullanır (API anahtarları gerekli, daha güvenilir)
# "selenium" - Web scraping kullanır (API anahtarı gerekmez, kullanıcı adı/şifre gerekli)
mode: "selenium"  # api veya selenium

# İzlenecek Twitter/X Hesapları
monitored_accounts:
  - "bbcturkce"
  - "cnnturk"
  - "NTV"
  # Buraya takip etmek istediğiniz hesapları ekleyin

# Bot Ayarları
bot:
  # Kişilik profili (personalities.yaml'dan seçin: yorumcu, haber_duyurucu, analist, mizahci)
  personality: "yorumcu"

  # Kontrol aralığı (dakika)
  check_interval: 5

  # Her çalıştırmada maksimum kaç tweet işlensin
  max_tweets_per_run: 10

  # Her çalıştırmada kaç tweet atılsın
  tweets_to_post_per_run: 1

  # Minimum kelime sayısı (çok kısa tweetleri göz ardı et)
  min_tweet_length: 20

# AI Ayarları
ai:
  model: "llama-3.1-70b-versatile"  # Groq model
  temperature: 0.7  # 0-1 arası (0: tutarlı, 1: yaratıcı)
  max_tokens: 280  # Tweet limiti

# Duplicate Detection
duplicate_detection:
  enabled: true
  similarity_threshold: 0.85  # 0-1 arası (0.85 = %85 benzerlik)
  check_last_days: 7  # Son kaç günün tweetlerini kontrol et

# Görsel/Resim Ayarları
images:
  enabled: true  # Tweet'lere otomatik resim eklensin mi?
  # Google Images'dan otomatik arama yapılır

# İnsan Davranışı Simülasyonu
human_behavior:
  # Rastgele zamanlama (base interval + 5-20 dakika arası rastgele)
  random_timing:
    enabled: true
    min_extra_minutes: 5   # Minimum ekstra dakika
    max_extra_minutes: 20  # Maksimum ekstra dakika

  # Çalışma saatleri (bu saatler dışında tweet atmaz)
  working_hours_start: 7   # Sabah 07:00
  working_hours_end: 1     # Gece 01:00 (sabaha kadar)

  # Rastgele atlama (bazen tweet atmamak - insan gibi)
  random_skip_chance: 0.05  # %5 ihtimalle bir cycle'ı atla

# Debug
debug:
  enabled: false
  save_raw_tweets: true
